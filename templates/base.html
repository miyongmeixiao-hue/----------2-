<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>猫カフェサイト（架空）</title>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=pets" />
        
        <style>
            body{
                background-color: #0E1322;
                color:white;
                font-family: "M PLUS Rounded 1c", sans-serif;
            }
            #title{
                margin-left: 20px;
            }
            .base{
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            nav{
                display: flex;
                gap: 20px;
                justify-content: flex-end;
                margin-right: 20px;
            }
            nav a{
                color: white;
                text-decoration: none;
            }
            #reservation{
                border: 1px solid #7892e8;
                border-radius: 10px;
                background-color: #7892e8;
                padding: 0px 5px;
            }
            .tagu{
                margin-top:20px;
            }
    
        </style>
    </head>
    <body>
        <div class="base">
            <h1 id="title"><span class="material-symbols-outlined">pets</span>  cats cafe(Fictional)</h1>
                <nav class="tagu">
                    <a href="/">ホーム</a>
                    <a href="/cats">
                        <span class="material-symbols-outlined">pets</span>
                    </a>
                    <a href="/company.html">企業情報</a>
                    <a href="/event.html">イベント</a>
                    <a href="/reservation" id="reservation">予約をする</a>
                </nav>
        </div>
        <hr>
        {% block content %}
        {% endblock %}
    </body>
</html>
